version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: logs/pipeline.log
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8
root:
  level: INFO
  handlers: [console, file]
